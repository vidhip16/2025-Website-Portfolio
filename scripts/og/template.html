<!doctype html><html><head><meta charset=utf-8><style>
@font-face{font-family:ISerif;src:url('%%SERIF%%')}
@font-face{font-family:ISerif;font-style:italic;src:url('%%SERIF_ITALIC%%')}
@font-face{font-family:ISans;font-weight:500;src:url('%%SANS500%%')}
@font-face{font-family:ISans;font-weight:650;src:url('%%SANS650%%')}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:#F6F1FA;color:#23162E;position:relative}
.g1{position:absolute;inset:0;background:radial-gradient(520px 420px at 78% 92%,rgba(255,134,181,.30),transparent 70%),radial-gradient(460px 360px at 6% 8%,rgba(94,200,255,.14),transparent 70%),radial-gradient(760px 520px at 60% 62%,rgba(183,163,240,.24),transparent 70%)}
.grain{position:absolute;inset:0;background:url('%%GRAIN%%');background-size:256px;opacity:.07}
.name,.dup{position:absolute;left:54px;bottom:26px;font-family:ISerif;font-weight:400;letter-spacing:-0.035em;line-height:.8;white-space:nowrap}
.name span,.dup span{display:block}
.patel{font-style:italic;padding-left:.42em}
.dup{z-index:4}.dup .v{visibility:hidden}
.shadow{position:absolute;filter:brightness(0) blur(22px);opacity:.16;transform:translate(2.5%,1.5%);z-index:2}
.ping{position:absolute;z-index:3}
.bl{display:inline-block;width:0;height:0;vertical-align:baseline}
.col{position:absolute;right:52px;top:54px;bottom:50px;width:268px;display:flex;flex-direction:column;justify-content:space-between;z-index:5}
.mono{height:64px;display:block;margin-left:-4px}
.sub{font-family:ISans;font-weight:500;font-size:25px;line-height:1.3;margin-top:26px;letter-spacing:-0.005em}
.sub b{font-weight:650}
.label{font-family:ISerif;font-style:italic;font-size:22px;line-height:1.4;opacity:.78;border-top:1.5px solid rgba(35,22,46,.25);padding-top:14px}
</style></head><body>
<div class=g1></div><div class=grain></div>
<div class=name><span>%%FIRST%%</span><span class=patel>%%LAST%%<i class=bl></i></span></div>
<img class=shadow src="%%PING%%" alt=""><img class=ping src="%%PING%%" alt="">
<div class=dup><span class=v>%%FIRST%%</span><span class=patel>%%LAST%%</span></div>
<div class=col><div><svg class=mono viewBox="%%VB%%"><path d="%%L%%" fill="#23162E"/><path d="%%E%%" fill="#B7A3F0" stroke="#23162E" stroke-width="26" stroke-linejoin="round"/></svg>
<p class=sub><b>%%LEAD%%</b> %%FOLLOW%%</p></div>
<p class=label>%%LABEL%%</p></div>
<script>
document.fonts.ready.then(() => {
  const name = document.querySelector('.name'), dup = document.querySelector('.dup');
  const spans = document.querySelectorAll('.name span');
  const ink = el => { const r = document.createRange(); r.selectNodeContents(el); return r.getBoundingClientRect(); };
  let size = 340;
  const set = s => { size = s; name.style.fontSize = dup.style.fontSize = s + 'px'; };
  set(size);
  const tooBig = () => {
    const v = ink(spans[0]), p = ink(spans[1]);
    const capTop = document.querySelector('.name .bl').getBoundingClientRect().top - size * 1.55;
    return v.right > 560 || p.right > 700 || capTop < 40;
  };
  while (tooBig() && size > 120) set(size - 4);
  const p = ink(spans[1]), v = ink(spans[0]);
  const baseline = document.querySelector('.name .bl').getBoundingClientRect().top;
  const h = 520, w = h * %%PING_W%% / %%PING_H%%;
  const imgs = [...document.querySelectorAll('.ping,.shadow')];
  const left = Math.max(p.right - w * 0.36, v.right + 6);
  const top = baseline + h * 0.03 - h * %%PING_BASE%%;
  imgs.forEach(el => { el.style.height = h + 'px'; el.style.left = left + 'px'; el.style.top = top + 'px'; });
  const capTop = baseline - size * 0.70;
  const cut = capTop + (baseline - capTop) * 0.64 - dup.getBoundingClientRect().top;
  dup.style.clipPath = `inset(${cut}px 0 0 0)`;
  document.body.dataset.ready = '1';
});
</script></body></html>
